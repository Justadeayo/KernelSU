name: Kernel & Manager Build

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: Type the clang version of ur kernel
        required: true
        type: choice
        options:
          - clang-3289846
          - clang-r416183b
          - clang-r450784e
          - clang-r475365b
          - clang-r487747c
          - clang-r498229b
          - clang-r510928
          - clang-r547379
          - clang-r563880
          - clang-r563880c
          - clang-r574158
          - clang-stable
        default: "clang-r416183b"

      kernel_source:
        description: Kernel Source Repo URL
        required: true
        type: string
        default: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"

      kernel_branch:
        description: Kernel Branch
        required: true
        type: string
        default: "sixteen"

      defconfig_name:
        description: Defconfig Name
        required: true
        type: string
        default: "vendor/violet-perf_defconfig"

      device_codename:
        description: Device Codename (e.g. marble, alioth, vayu)
        required: true
        type: string
        default: "violet"

      ksu_type:
        description: "KernelSU Version"
        required: false
        type: choice
        options:
          - None
          - KernelSU
          - ReSukiSU-with-susfs
        default: KernelSU

      BUILD_COMMIT:
        description: "Any new changes that applies as a build note/commit"
        required: true
        type: string
        default: "Synced with upstream changes 💯"

      telegram_chat_id:
        description: "Telegram Chat ID (Optional - defaults to repo secret)"
        required: false
        type: string

      telegram_bot_token:
        description: "Telegram Bot Token (Optional - defaults to repo secret)"
        required: false
        type: string

env:
  TZ: "Africa/Lagos"

jobs:
  build-manager:
    if: ${{ inputs.ksu_type == 'KernelSU' }}
    uses: Justadeayo/KernelSU/.github/workflows/build-manager.yml@Custom-build
    with:
      telegram_chat_id: ${{ inputs.telegram_chat_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  Kernel_CI:
    if: always() && !cancelled() && (needs.build-manager.result == 'success' || needs.build-manager.result == 'skipped')
    needs: build-manager
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      checks: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Export Secrets and Vars
        run: |
          TG_CHAT="${{ inputs.telegram_chat_id }}"
          TG_TOKEN="${{ inputs.telegram_bot_token }}"
          
          if [ -z "$TG_CHAT" ]; then
            TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi
          if [ -z "$TG_TOKEN" ]; then
            TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          fi
          
          echo "TELEGRAM_CHAT_ID=${TG_CHAT}" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${TG_TOKEN}" >> $GITHUB_ENV
          echo "GH_TOKEN=${{ github.token }}" >> $GITHUB_ENV

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ inputs.device_codename }}
          max-size: 5G

      - name: Start Time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Timeout="5" -o Acquire::Retries="0" update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip

      - name: Clone Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_source }} kernel

      - name: Prepare Metadata
        run: |
          echo "KERNEL_VER=$(cd kernel && make kernelversion)" >> $GITHUB_ENV
          
          git clone --depth=1 https://github.com/Justadeayo/KernelSU.git KSU_REPO
          cd KSU_REPO
          KSU_LOG=$(git log -1 --format="%s" | tr -d '"\n')
          KSU_HASH=$(git rev-parse --short HEAD)
          cd ..
          
          echo "LAST_KSU_COMMIT=${KSU_LOG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${KSU_HASH}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ inputs.BUILD_COMMIT }}" >> $GITHUB_ENV
          
          if [[ "${{ inputs.ksu_type }}" == "ReSukiSU-with-susfs" ]]; then
            echo "SUSFS_LABEL=Yes" >> $GITHUB_ENV
          else
            echo "SUSFS_LABEL=N/A" >> $GITHUB_ENV
          fi

      - name: Send Build Start Message
        run: |
          START_MSG="🛠 *XCalibur Kernel Build Started!*%0A%0A"
          START_MSG+="*Device*: \`${{ inputs.device_codename }}\`%0A"
          START_MSG+="*Root*: \`${{ inputs.ksu_type }}\`%0A"
          START_MSG+="*Status*: Compilation in progress..."

          curl -sX POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${START_MSG}"

      - name: Download AOSP Clang
        run: |
          mkdir -p toolchains/${{ inputs.clang_version }}
          cd toolchains
          if [[ "${{ inputs.clang_version }}" == "clang-r416183b" ]]; then
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ${{ inputs.clang_version }}
          else
            OLD_TAGS=("clang-r450784e" "clang-r475365b" "clang-r487747c" "clang-r498229b" "clang-r510928")
            if [[ " ${OLD_TAGS[@]} " =~ " ${{ inputs.clang_version }} " ]]; then
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r33/${{ inputs.clang_version }}.tar.gz
            else
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/${{ inputs.clang_version }}.tar.gz
            fi
            tar -xf "${{ inputs.clang_version }}.tar.gz" -C ${{ inputs.clang_version }}
          fi

      - name: Compile Kernel
        run: |
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${{ inputs.clang_version }}/bin"
          export PATH="/usr/lib/ccache:${CLANG_ROOT}:$PATH"
          export CC="ccache ${CLANG_ROOT}/clang"
          export CXX="ccache ${CLANG_ROOT}/clang++"
          export HOSTCC="ccache ${CLANG_ROOT}/clang"
          export HOSTCXX="ccache ${CLANG_ROOT}/clang++"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          cd kernel
          mkdir -p out
          
          # Initialize KernelSU setup scripts directly from Justadeayo/KernelSU
          case "${{ inputs.ksu_type }}" in
            "KernelSU")
              curl -LSs "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh" > setup.sh
              sed -i 's|backslashxx/KernelSU|Justadeayo/KernelSU|g' setup.sh
              bash setup.sh master
              ;;
            "ReSukiSU-with-susfs")
              curl -LSs "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh" > setup.sh
              sed -i 's|backslashxx/KernelSU|Justadeayo/KernelSU|g' setup.sh
              bash setup.sh master
              ;;
          esac
          
          DEFCONFIG="arch/arm64/configs/${{ inputs.defconfig_name }}"
          
          if [[ "${{ inputs.ksu_type }}" != "None" ]]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG"
            echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          fi
          
          # Download and apply SuSFS kernel-level patches for 4.14
          if [[ "${{ inputs.ksu_type }}" == "ReSukiSU-with-susfs" ]]; then
            curl -Lo susfs.patch https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.14.patch
            curl -Lo inline.sh https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh
            patch -p1 < susfs.patch
            bash inline.sh
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          fi
          
          touch ./.scmversion
          make O=out ${{ inputs.defconfig_name }}

          if [[ "${{ inputs.ksu_type }}" == "KernelSU" ]]; then
            echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> out/.config
          fi

          if [[ "${{ inputs.ksu_type }}" != "None" ]]; then
            make O=out olddefconfig
          fi
          
          set +e
          make -j$(nproc) O=out 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Kernel compilation failed!"
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="${{ inputs.device_codename }}_${{ inputs.ksu_type }}_$(date +"%Y%m%d_%H%M")"
          BOOT_DIR="kernel/out/arch/arm64/boot"
          
          git clone -b master https://github.com/Justadeayo/AnyKernel3.git
          
          if [ -f $BOOT_DIR/Image.gz ]; then
              cp $BOOT_DIR/Image.gz AnyKernel3/Image.gz
          elif [ -f $BOOT_DIR/Image.gz-dtb ]; then
              cp $BOOT_DIR/Image.gz-dtb AnyKernel3/Image.gz-dtb
          fi
          
          if [ -f $BOOT_DIR/dtb.img ]; then
              cp $BOOT_DIR/dtb.img AnyKernel3/dtb
          elif [ -f $BOOT_DIR/dtb ]; then
              cp $BOOT_DIR/dtb AnyKernel3/dtb
          fi
          
          if [ -f $BOOT_DIR/dtbo.img ]; then
              cp $BOOT_DIR/dtbo.img AnyKernel3/dtbo.img
          fi
          
          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=${{ inputs.device_codename }}/" anykernel.sh
          
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${{ inputs.clang_version }}/bin"
          CLANG_VER=$("${CLANG_ROOT}/clang" --version | head -n1 | sed 's/(https.*//' | sed 's/ version//' | xargs)
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M WAT')
          
          if [[ "${{ inputs.ksu_type }}" != "None" ]]; then
            sed -i "s|ksu_supported=false|ksu_supported=true|" anykernel.sh
          fi
          
          sed -i "s|##CLANG_VERSION##|${CLANG_VER}|" anykernel.sh
          sed -i "s|##BUILD_DATE##|${BUILD_DATE}|" anykernel.sh
          
          zip -r9 ../"${ZIP_NAME}.zip" * -x .git
          
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Download compiled Manager APK
        if: ${{ inputs.ksu_type == 'KernelSU' }}
        uses: actions/download-artifact@v4
        with:
          name: manager
          path: manager_out/
        continue-on-error: true

      - name: Upload to Telegram
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          FILE_SIZE=$(du -sh "$ZIP_FILE" | cut -f1)
          APK_FILE=$(find manager_out/ -type f -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            curl -sX POST -F document=@"${APK_FILE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=📦 *Manager APK*"
          fi

          SUCCESS_MSG="*=============================*%0A"
          SUCCESS_MSG+="*   X C A L I B U R  -  K E R N E L  *%0A"
          SUCCESS_MSG+="*=============================*%0A"
          SUCCESS_MSG+="%0A"
          SUCCESS_MSG+="*Developer*: @Justus26🪖%0A"
          SUCCESS_MSG+="*Device*: \`${{ inputs.device_codename }}\`%0A"
          SUCCESS_MSG+="*Linux Ver*: \`${{ env.KERNEL_VER }}\`%0A"
          SUCCESS_MSG+="*Compiler*: \`${{ inputs.clang_version }}\`%0A"
          SUCCESS_MSG+="*Root*: \`${{ inputs.ksu_type }}\`%0A"
          SUCCESS_MSG+="*SUSFS*: \`${{ env.SUSFS_LABEL }}\`%0A"
          SUCCESS_MSG+="*Size*: \`${FILE_SIZE}\`%0A"
          SUCCESS_MSG+="*Duration*: \`${MINS}m ${SECS}s\`%0A"
          SUCCESS_MSG+="*Date*: \`$(date +'%Y-%m-%d %H:%M WAT')\`%0A"
          SUCCESS_MSG+="Download APK and Zip from latest Release on https://github.com/Justadeayo/KernelSU/releases"

          curl -sX POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${SUCCESS_MSG}"
            
      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFSET=-15
          RUN_NUM=${{ github.run_number }}
          TAG_BUILD=$((OFFSET + RUN_NUM))
          TAG_NAME="v3.3.0-${TAG_BUILD}-beta"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -f -a "$TAG_NAME" -m "Kernel Build Release $TAG_NAME"
          git push origin "$TAG_NAME" --force

          ZIP_FILE=$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -name "*.zip" | head -n 1)
          APK_FILE=$(find manager_out/ -type f -name "*.apk" 2>/dev/null | head -n 1)

          CHANGELOG_NOTES="* Synced with Upstream Changes.
          * Latest patch included

          ~by Justus26 🎖️"

          ASSETS=()
          [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ] && ASSETS+=("$ZIP_FILE")
          [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ] && ASSETS+=("$APK_FILE")

          gh release create "$TAG_NAME" "${ASSETS[@]}" \
            --title "$TAG_NAME" \
            --notes "$CHANGELOG_NOTES" \
            --prerelease \
            --clobber
          

      - name: Send Build Failure Message & Logs
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))

          if [ -f "${GITHUB_WORKSPACE}/build.log" ]; then
            tail -n 35 "${GITHUB_WORKSPACE}/build.log" > "${GITHUB_WORKSPACE}/error_preview.txt"
            zip -j "${GITHUB_WORKSPACE}/error_logs.zip" "${GITHUB_WORKSPACE}/build.log" "${GITHUB_WORKSPACE}/error_preview.txt"
          fi

          FAIL_MSG="*Build Failed!* ❌

          *Device*: \`${{ inputs.device_codename }}\`
          *KernelSU*: \`${{ inputs.ksu_type }}\`
          *Duration*: \`${MINS}m ${SECS}s\`
          *Run Link*: [View Actions Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [ -f "${GITHUB_WORKSPACE}/error_logs.zip" ]; then
            curl -sX POST -F document=@"${GITHUB_WORKSPACE}/error_logs.zip" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=${FAIL_MSG}"
          else
            curl -sX POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" \
              -d "text=${FAIL_MSG}"
          fi
