name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and Push Version Tag
        id: version
        run: |
          OFFSET=35
          RUN_NUM=${{ github.run_number }}
          TAG_BUILD=$((OFFSET + RUN_NUM))
          VERSION_TAG="v3.2.5-${TAG_BUILD}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

          echo "TAG_NAME=${VERSION_TAG}" >> $GITHUB_ENV
          echo "Generated Tag: ${VERSION_TAG}"

      - name: Download Manager Artifact
        uses: actions/download-artifact@v4
        with:
          name: manager
          path: release_assets/

      - name: Download Kernel ZIP Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kernel-zip
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            • Synced with Upstream Changes.
            • Latest patch included
            
            
            ~by Justus26🎖️
          files: |
            release_assets/*.apk
            release_assets/*.zip
          draft: false
          prerelease: false
