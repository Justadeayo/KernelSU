name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Download the compiled Manager APK
      - name: Download Manager Artifact
        uses: actions/download-artifact@v4
        with:
          name: manager
          path: release_assets/

      # 2. Download the compiled Kernel ZIP (if triggered via a run that built it)
      - name: Download Kernel ZIP Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true # Prevents failure if you run release.yml independently without a kernel build
        with:
          name: kernel-zip
          path: release_assets/

      # 3. Create GitHub Release with all available assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*.apk
            release_assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          
