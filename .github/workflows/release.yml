name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Calculate version tag v3.2.5-<incremental_number> starting at 36
      - name: Generate Version Tag
        id: version
        run: |
          OFFSET=35
          RUN_NUM=${{ github.run_number }}
          TAG_BUILD=$((OFFSET + RUN_NUM))
          VERSION_TAG="v3.2.5-${TAG_BUILD}"
          echo "TAG_NAME=${VERSION_TAG}" >> $GITHUB_ENV
          echo "Generated Tag: ${VERSION_TAG}"

      # 1. Download the compiled Manager APK
      - name: Download Manager Artifact
        uses: actions/download-artifact@v4
        with:
          name: manager
          path: release_assets/

      # 2. Download the compiled Kernel ZIP (if triggered via a run that built it)
      - name: Download Kernel ZIP Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kernel-zip
          path: release_assets/

      # 3. Create GitHub Release using generated tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            • Synced with Upstream Changes.
            • Latest patch included
            • Experimental LKM support added

            ~by Justus26🎖️
          files: |
            release_assets/*.apk
            release_assets/*.zip
          draft: false
          prerelease: false
